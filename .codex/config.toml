[mcp_servers.graphify]
command = "bash"
args = ["-lc", "root=\"$(git -C \"${CLAUDE_PROJECT_DIR:-.}\" rev-parse --show-toplevel 2>/dev/null || exit 1)\"; cd \"$root\"; exec node \"$root/scripts/mcp-launcher.mjs\" graphify"]
startup_timeout_sec = 30

[mcp_servers."operator-synaciel-repository"]
command = "bash"
args = ["-lc", "root=\"$(git -C \"${CLAUDE_PROJECT_DIR:-.}\" rev-parse --show-toplevel 2>/dev/null || exit 1)\"; cd \"$root\"; exec node \"$root/scripts/mcp-launcher.mjs\" repository"]
startup_timeout_sec = 30
tool_timeout_sec = 660
default_tools_approval_mode = "writes"
enabled_tools = [
  "repository_workflow_status",
  "prepare_repository_change",
  "apply_repository_change",
  "verify_repository_change",
  "prepare_working_tree_commit",
  "git_commit_working_tree",
  "prepare_commits",
  "git_commit_files",
]

[mcp_servers."operator-synaciel-repository".tools.apply_repository_change]
approval_mode = "prompt"

[mcp_servers."operator-synaciel-repository".tools.git_commit_working_tree]
approval_mode = "prompt"

[mcp_servers."operator-synaciel-repository".tools.git_commit_files]
approval_mode = "prompt"
