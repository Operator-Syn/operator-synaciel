<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Basic SEO -->
  <title>Software Developer Portfolio — Operator-Syn | Syn-Forge</title>
  <meta id="meta-description" name="description" content="Explore Syn-Forge: Operator-Syn's software developer portfolio of projects, experiments, code snippets, and practical notes on software development." />
  <meta name="author" content="Operator-Syn">
  <meta name="robots" content="index, follow">

  <!-- Canonical -->
  <link rel="canonical" href="https://syn-forge.com/" />
  <link rel="alternate" type="text/plain" href="/llms.txt" title="AI-readable portfolio context" />

  <!-- Favicon -->
  <link rel="icon" href="https://personal-portfolio-bucket.syn-forge.com/ProfilePicture/nice.webp" type="image/webp" />

  <!-- Performance preconnect -->
  <link rel="preconnect" href="https://personal-portfolio-bucket.syn-forge.com" crossorigin>
  <link rel="preconnect" href="https://personal-portfolio.syn-forge.com" crossorigin>

  <!-- Self-hosted faces; the preloads cover the body and display faces. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/ibm-plex-sans-var.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/newsreader-400.woff2" />

  <!-- OpenGraph -->
  <meta property="og:title" content="Software Developer Portfolio — Operator-Syn | Syn-Forge" />
  <meta property="og:description" content="Explore Syn-Forge: Operator-Syn's software developer portfolio of projects, experiments, code snippets, and practical notes on software development." />
  <meta property="og:image" content="https://syn-forge.com/social-image.png" />
  <meta property="og:image:secure_url" content="https://syn-forge.com/social-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Software Developer Portfolio — Operator-Syn — Syn-Forge social preview" />
  <meta property="og:url" content="https://syn-forge.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Syn-Forge" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Software Developer Portfolio — Operator-Syn | Syn-Forge" />
  <meta name="twitter:description" content="Explore Syn-Forge: Operator-Syn's software developer portfolio of projects, experiments, code snippets, and practical notes on software development." />
  <meta name="twitter:image" content="https://syn-forge.com/social-image.png" />

  <!-- Structured data is injected by functions/_middleware.ts, one @graph per route. -->

</head>

<body>

  <!-- React Root -->
  <div id="root"></div>

  <!-- React Entry -->
  <script type="module" src="/src/main.tsx"></script>

</body>

</html>
