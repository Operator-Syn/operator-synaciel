<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="dark" />
  <title>Page not found | Syn-Forge</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #101111;
      --surface: #171918;
      --text: #f2ede3;
      --muted: #b7b1a7;
      --faint: #8d8a83;
      --line: rgb(242 237 227 / 18%);
      --signal: #f0a42a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: clamp(1.25rem, 5vw, 4rem);
      background: var(--canvas);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(44rem, 100%);
      padding: clamp(1.5rem, 5vw, 3rem);
      border: 1px solid var(--line);
      background: linear-gradient(180deg, var(--surface), var(--canvas));
    }

    .eyebrow {
      margin: 0 0 0.75rem;
      color: var(--signal);
      font: 500 0.75rem/1.4 ui-monospace, monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 1rem;
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 6vw, 3.25rem);
      font-weight: 400;
      line-height: 1.05;
    }

    .status {
      margin: 0 0 1.25rem;
      color: var(--faint);
      font: 0.8125rem/1.5 ui-monospace, monospace;
    }

    .lede {
      max-width: 38rem;
      margin: 0 0 1.5rem;
      color: var(--muted);
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 2.75rem;
      padding: 0.6rem 1rem;
      border: 1px solid var(--line);
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      border-color: var(--signal);
      color: var(--signal);
      outline: none;
    }

    a.primary {
      border-color: var(--signal);
      background: var(--signal);
      color: #1a1206;
    }

    a.primary:hover,
    a.primary:focus-visible {
      background: #ffbb52;
      color: #1a1206;
    }
  </style>
</head>

<body>
  <main>
    <p class="eyebrow">404</p>
    <h1>This path left the archive.</h1>
    <p class="status">No matching page at this address.</p>
    <p class="lede">
      The page may have moved, or the link may be incomplete. Use one of these
      routes to get back to the work.
    </p>
    <nav aria-label="Recovery routes">
      <a class="primary" href="/">Return home</a>
      <a href="/projects">Projects</a>
      <a href="/snippets">Snippets</a>
      <a href="/ai">AI + MCP</a>
    </nav>
  </main>
</body>

</html>
