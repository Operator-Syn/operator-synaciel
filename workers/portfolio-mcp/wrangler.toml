name = "syn-forge-portfolio-mcp"
main = "src/index.ts"
compatibility_date = "2026-08-27"

[[services]]
binding = "PORTFOLIO_API"
service = "portfolio-api"

[[routes]]
pattern = "mcp.syn-forge.com"
custom_domain = true

[env.local.vars]
PORTFOLIO_API_BASE_URL = "https://personal-portfolio.syn-forge.com"

[observability.logs]
enabled = true
invocation_logs = true
